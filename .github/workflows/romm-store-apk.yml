name: RomM Store APK

on:
  push:
    paths:
      - "romm-store/**"
      - ".github/workflows/romm-store-apk.yml"
  pull_request:
    paths:
      - "romm-store/**"
      - ".github/workflows/romm-store-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build inlined store HTML
        working-directory: romm-store
        run: npm ci && npm test && npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble debug APK
        working-directory: romm-store/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CocoonRommStore-debug
          path: romm-store/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
